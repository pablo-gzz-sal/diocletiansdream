<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Diocletian's Dream VR Museum | Step Back Into 305 AD</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="A 15-minute VR museum experience in Split that rebuilds Diocletian's Palace as it stood in 305 AD. Beside the Golden Gate. Adult €13, child €9. Book online." />

    <!--
      Preconnect to the third-party origins the first viewport actually needs.
      The Vimeo trailer is the LCP element on the home page, and the DNS +
      TLS handshake for player.vimeo.com is otherwise paid after Angular boots.
    -->
    <link rel="preconnect" href="https://player.vimeo.com" />
    <link rel="preconnect" href="https://www.googletagmanager.com" />
    <link rel="dns-prefetch" href="https://app.turitop.com" />

    <!-- Google Search Console site verification (carried over from the old WordPress site). -->
    <meta name="google-site-verification" content="spY1d7Mrx40JOT4u7GjuC1GKnHSPCHdFBLrEg4X3Kfo" />

    <!-- Google tag (GA4 + Google Ads) -->
    <!--
      Consent Mode v2. The consent defaults MUST be set before gtag.js runs, so
      this block deliberately sits above the async loader: anything below it
      would let the tag write ad/analytics cookies before the visitor answers
      the banner, which is exactly what the EU consent rules forbid.

      Storage is denied by default for everyone, not just the EEA — the banner
      is shown site-wide, so a regionless default keeps one code path. Consent
      is then granted (or not) by ConsentService via gtag('consent','update').
      'security_storage' stays granted: it is strictly necessary and not opt-in.
    -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
        functionality_storage: 'denied',
        personalization_storage: 'denied',
        security_storage: 'granted',
        // Hold tags briefly so a returning visitor's stored consent is applied
        // before the first pageview fires, rather than after it as a denied hit.
        wait_for_update: 500
      });

      // Replay the stored decision as early as possible. ConsentService is the
      // source of truth and re-applies this after bootstrap, but Angular starts
      // well after the first pageview — without this, every returning visitor's
      // first hit of the session would be recorded as consent-denied.
      try {
        var stored = localStorage.getItem('dd.cookie-consent');
        if (stored) {
          var c = JSON.parse(stored);
          gtag('consent', 'update', {
            ad_storage: c.marketing ? 'granted' : 'denied',
            ad_user_data: c.marketing ? 'granted' : 'denied',
            ad_personalization: c.marketing ? 'granted' : 'denied',
            analytics_storage: c.analytics ? 'granted' : 'denied',
            functionality_storage: 'granted',
            personalization_storage: c.analytics ? 'granted' : 'denied'
          });
        }
      } catch (e) {
        /* private mode / blocked storage — stay with the denied defaults */
      }

      gtag('js', new Date());

      // ads_data_redaction strips ad click identifiers from Google Ads pings
      // while ad_storage is denied, so pre-consent traffic stays non-identifying.
      gtag('set', 'ads_data_redaction', true);
      gtag('set', 'url_passthrough', true);

      gtag('config', 'G-QN1CZT8HXQ');
      gtag('config', 'AW-11199515913');
    </script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-QN1CZT8HXQ"></script>
    <!-- LIVE: indexing enabled at go-live (paired with environment.siteIndexable = true). -->
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://diocletiansdream.com/" />

    <!--
      Open Graph. og:image was missing entirely, which meant every share of the
      home page rendered as a bare text link, and ChatGPT and Perplexity fell
      back to scraping arbitrary body text for a summary. PageSeoService
      overwrites title/description/url per route; these are the SSR defaults.
    -->
    <meta property="og:site_name" content="Diocletian's Dream VR Museum" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://diocletiansdream.com/" />
    <meta property="og:title" content="Diocletian's Dream VR Museum | Step Back Into 305 AD" />
    <meta property="og:description" content="Step into a VR reconstruction of Diocletian's Palace as it stood in 305 AD. A 15-minute experience in Split, Croatia." />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="https://diocletiansdream.com/assets/images/og-default.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Diocletian's Palace reconstructed in virtual reality as it stood in 305 AD" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Diocletian's Dream VR Museum | Step Back Into 305 AD" />
    <meta name="twitter:description" content="Step into a VR reconstruction of Diocletian's Palace as it stood in 305 AD. A 15-minute experience in Split, Croatia." />
    <meta name="twitter:image" content="https://diocletiansdream.com/assets/images/og-default.jpg" />

    <meta name="theme-color" content="#2d046a" />

    <!-- The logo is a PNG. Declaring image/svg+xml made Chrome discard it. -->
    <link rel="icon" type="image/png" href="assets/images/ddLogo.png" />
    <link rel="apple-touch-icon" href="assets/images/ddLogo.png" />
  </head>

    <app-root></app-root>
    <script
      id="js-turitop"
      src="https://app.turitop.com/js/load-turitop.min.js"
      data-company="D560"
      data-buttoncolor="green"
      data-afftag="ttafid"
    ></script>
  </body>
</html>
