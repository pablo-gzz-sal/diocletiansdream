<!-- ═══ PARTNERS / RECOMMENDED THINGS TO DO ═══ -->
<section class="partners">
  <div class="partners-inner">

    <!-- No wrapper revealOnScroll — children animate independently to avoid nested opacity conflicts -->
    <div class="partners-header">
      <p class="eyebrow" revealOnScroll [revealDelay]="0">{{ 'home.partners.eyebrow' | translate }}</p>
      <h2 class="section-h2" revealOnScroll [revealDelay]="0.12" [revealClip]="true">
        {{ 'home.partners.title' | translate }}
      </h2>
      <p class="partners-intro" revealOnScroll [revealDelay]="0.2">{{ 'home.partners.text' | translate }}</p>
    </div>

    <div class="partners-cards">
      @for (p of partners; track p.href) {
        <div class="pcard" revealOnScroll [revealDelay]="0.1 + $index * 0.1">
          <span class="pcard-num">{{ p.num }}</span>
          <p class="pcard-title">{{ p.name }}</p>
          <p class="pcard-text">{{ p.text | translate }}</p>

          <a
            [href]="p.href"
            target="_blank"
            rel="noopener noreferrer"
            class="btn btn--ghost pcard-btn"
          >
            {{ 'home.partners.visitSite' | translate }}
            <!-- Outbound arrow — signals the link leaves the site -->
            <svg class="pcard-arrow" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M5 11L11 5M11 5H6M11 5v5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </a>
        </div>
      }
    </div>

  </div>
</section>
